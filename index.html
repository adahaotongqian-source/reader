<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#24466B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reader">
<meta name="description" content="阅读器 Reader：在浏览器里看书、听书的本地阅读器，支持 TXT 与 EPUB。">

<body>
<title>阅读器 Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: 书架 = 居中网格书封；阅读 = 左目录 + 中间正文栏 + 底部常驻播放条 */
:root{
  --bg:#F2F3F1; --surface:#FFFFFF; --paper:#FCFCFA;
  --ink:#1D2125; --ink-2:#5A6067; --ink-3:#8B9198;
  --line:#DCDFDC; --accent:#24466B; --accent-soft:#E4EAF1; --on-accent:#FFFFFF;
  --hl:rgba(36,70,107,.12); --hl-edge:rgba(36,70,107,.35);
  --ok:#3C8A5A; --warn:#B07A1E;
  --shadow:0 1px 2px rgba(20,30,40,.08),0 10px 24px -14px rgba(20,30,40,.35);
  --f-serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --fs:19px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131518; --surface:#1A1D21; --paper:#16191C;
  --ink:#E3E5E2; --ink-2:#A2A8AE; --ink-3:#6F767D;
  --line:#2B3036; --accent:#93B2D6; --accent-soft:#1E2A38; --on-accent:#0F1A26;
  --hl:rgba(147,178,214,.16); --hl-edge:rgba(147,178,214,.45);
  --ok:#6FBF8C; --warn:#D9A84E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -14px rgba(0,0,0,.8);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#131518; --surface:#1A1D21; --paper:#16191C;
  --ink:#E3E5E2; --ink-2:#A2A8AE; --ink-3:#6F767D;
  --line:#2B3036; --accent:#93B2D6; --accent-soft:#1E2A38; --on-accent:#0F1A26;
  --hl:rgba(147,178,214,.16); --hl-edge:rgba(147,178,214,.45);
  --ok:#6FBF8C; --warn:#D9A84E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -14px rgba(0,0,0,.8);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:14px;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.view{height:100%}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 16px;font-size:14px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.ibtn{border:0;background:transparent;border-radius:6px;padding:6px 10px;color:var(--ink-2);font-size:14px;display:inline-flex;align-items:center;gap:4px}
.ibtn:hover{background:var(--accent-soft);color:var(--ink)}
.ibtn[aria-pressed="true"]{color:var(--accent)}

/* ---------- shelf ---------- */
#shelf{overflow-y:auto}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shelf-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:40px 28px}
.brand{display:flex;align-items:center;gap:14px}
.seal{width:40px;height:40px;border-radius:5px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-serif);font-weight:700;font-size:22px}
.brand h1{margin:0;font-family:var(--f-serif);font-weight:700;font-size:24px;letter-spacing:.08em}
.h1-cn{font-weight:600;font-size:.72em;color:var(--ink-2);letter-spacing:.06em;margin-left:4px}
.brand p{margin:2px 0 0;color:var(--ink-3);font-size:13px;letter-spacing:.04em}
main.wrap{padding-block:0 64px}

.cont{display:flex;align-items:center;gap:24px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 26px;margin-bottom:44px}
.cont .mini{width:64px;flex:none}
.cont .mini .cover{padding:8px 6px 6px 12px;pointer-events:none}
.cont .mini .cv-title{font-size:11px;-webkit-line-clamp:4}
.cont .mini .cv-author,.cont .mini .cv-fmt,.cont .mini .cv-rule{display:none}
.cont-info{flex:1;min-width:200px}
.eyebrow{font-size:12px;color:var(--ink-3);letter-spacing:.16em}
.cont-info h3{margin:6px 0 4px;font-family:var(--f-serif);font-size:20px;font-weight:600}
.cont-info .where{color:var(--ink-2);font-size:13px}
.cont-info .bar{margin-top:12px;max-width:360px}
.cont-actions{display:flex;gap:10px}

.sec-head{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:28px}
.sec-head h2{margin:0;font-family:var(--f-serif);font-size:18px;font-weight:600;letter-spacing:.1em}
.sec-head span{color:var(--ink-3);font-size:13px;font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:36px 28px}
.book{position:relative;min-width:0}
.cover{position:relative;display:flex;flex-direction:column;width:100%;aspect-ratio:3/4.2;max-width:100%;border:0;text-align:left;
  background:var(--c);color:#fff;border-radius:2px 6px 6px 2px;padding:18px 14px 14px 22px;box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease;overflow:hidden}
.cover::before{content:"";position:absolute;inset:0 auto 0 0;width:9px;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,0));}
.cover::after{content:"";position:absolute;top:0;bottom:0;left:11px;width:1px;background:rgba(255,255,255,.14)}
.book:hover .cover{transform:translateY(-3px)}
.cv-title{font-family:var(--f-serif);font-weight:600;font-size:17px;line-height:1.45;letter-spacing:.04em;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden;word-break:break-all}
.cv-rule{width:22px;height:1px;background:rgba(255,255,255,.5);margin:12px 0 8px}
.cv-author{font-size:12px;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv-fmt{margin-top:auto;font-size:10px;letter-spacing:.18em;opacity:.6}
.b-meta{margin-top:12px}
.b-title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b-sub{font-size:12px;color:var(--ink-3);margin-top:3px;font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.b-del{position:absolute;top:8px;right:8px;border:0;border-radius:4px;padding:3px 8px;font-size:12px;background:rgba(0,0,0,.45);color:#fff;opacity:0;transition:opacity .15s}
.book:hover .b-del,.b-del:focus-visible,.b-del.armed{opacity:1}
.b-del.armed{background:#A3312F}
.add-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;aspect-ratio:3/4.2;max-width:100%;border:1.5px dashed var(--line);border-radius:6px;background:transparent;color:var(--ink-2);text-align:center;padding:12px}
.add-tile:hover{border-color:var(--accent);color:var(--accent)}
.add-tile .plus{font-size:28px;line-height:1;font-weight:300}
.add-tile small{color:var(--ink-3);font-size:12px;line-height:1.6}
.note{margin-top:56px;color:var(--ink-3);font-size:12.5px;line-height:1.8;max-width:60em}
.drop-mask{position:fixed;inset:12px;border:2px dashed var(--accent);border-radius:14px;background:color-mix(in srgb,var(--bg) 85%,transparent);display:none;place-items:center;font-family:var(--f-serif);font-size:22px;color:var(--accent);z-index:30;pointer-events:none}
#shelf.dragging .drop-mask{display:grid}

/* ---------- reader ---------- */
#reader{display:grid;grid-template-rows:52px auto minmax(0,1fr) auto;background:var(--paper)}
.r-top{display:flex;align-items:center;gap:6px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface);min-width:0}
.r-title{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2);font-size:13px}
.r-title b{color:var(--ink);font-family:var(--f-serif);font-weight:600;font-size:15px;margin-right:10px}
.r-tools{display:flex;gap:2px}
.r-body{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:0;position:relative}
#reader.toc-off .r-body{grid-template-columns:0 minmax(0,1fr)}
#reader.toc-off .toc{visibility:hidden}
.toc{border-right:1px solid var(--line);background:var(--surface);overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.toc-head{position:sticky;top:0;background:var(--surface);padding:16px 20px 10px;font-size:12px;letter-spacing:.16em;color:var(--ink-3);display:flex;justify-content:space-between}
.toc ol{list-style:none;margin:0;padding:0 0 12px}
.toc li button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:8px 20px;font-size:13.5px;line-height:1.5;color:var(--ink-2);border-left:2px solid transparent}
.toc li button:hover{background:var(--accent-soft);color:var(--ink)}
.toc li button.on{color:var(--accent);font-weight:600;border-left-color:var(--accent);background:var(--accent-soft)}
.toc-foot{margin-top:auto;padding:14px 20px 18px;border-top:1px solid var(--line);font-size:12px;line-height:1.7;color:var(--ink-3)}
.scroller{overflow-y:auto;min-width:0;scroll-padding-top:40px}
.article{max-width:36em;margin:0 auto;padding:56px 32px 30vh;font-family:var(--f-serif);font-size:var(--fs);line-height:1.95;letter-spacing:.02em;color:var(--ink)}
.article.sans{font-family:var(--f-sans)}
.para{margin:0 0 .85em;text-indent:2em;text-align:justify}
.para.sub{text-indent:0;font-weight:600;margin-top:1.4em}
.ch-title{text-indent:0;text-align:center;font-size:1.45em;font-weight:700;letter-spacing:.08em;line-height:1.5;margin:.4em 0 1.6em;text-wrap:balance}
.s{border-radius:3px;transition:background-color .2s}
.s.cur{background:var(--hl);box-shadow:0 0 0 2px var(--hl);}
.ch-nav{display:flex;justify-content:center;gap:12px;margin-top:3em;font-family:var(--f-sans);font-size:14px}
.ch-nav .btn{min-width:120px}

.player{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface)}
.pl-ctrl{display:flex;align-items:center;gap:6px}
.pl-ctrl .ibtn{width:36px;height:36px;justify-content:center;padding:0}
.play{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.play:hover{filter:brightness(1.08)}
.pl-info{flex:1;min-width:180px;line-height:1.5}
#plState{font-size:13px;color:var(--ink);display:flex;align-items:center;gap:8px}
#plPos{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.playing .dot{background:var(--accent);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.pl-set{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.pl-set label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);letter-spacing:.06em}
.pl-set select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;font-size:13px;max-width:240px;letter-spacing:0}
.pl-set input[type=range]{width:110px;accent-color:var(--accent)}
.pl-set output{font-size:13px;color:var(--ink);min-width:3em;font-variant-numeric:tabular-nums;letter-spacing:0}
#locateBtn{padding:6px 12px;font-size:13px}

#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:min(90vw,560px);text-align:center;line-height:1.6}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* sync + mobile helpers */
.head-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;white-space:nowrap;background:var(--surface)}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.chip.on i{background:var(--ok)}
.chip.warn i{background:var(--warn)}
button.chip{cursor:pointer;font:inherit;font-size:12px}
button.chip:hover{border-color:var(--ink-3)}
.pair-back{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:grid;place-items:center;padding:16px}
.pair{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(440px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px 22px 18px}
.pair h2{font-family:var(--f-serif);font-size:19px;margin:0 0 8px}
.pair p{color:var(--ink-2);line-height:1.75;margin:0 0 12px;font-size:13.5px}
.pair .qr{display:grid;place-items:center;background:#fff;border-radius:8px;padding:12px;width:204px;margin:6px auto 12px}
.pair .code{font-family:ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.06em;background:var(--accent-soft);border-radius:6px;padding:8px 10px;word-break:break-all;text-align:center;margin-bottom:10px;user-select:all}
.pair .row{display:flex;gap:8px;flex-wrap:wrap}
.pair .row .btn{flex:1;min-width:120px}
.pair input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;background:transparent;padding:8px 10px;font-family:ui-monospace,Menlo,monospace}
.pair hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.pair .x{float:right;border:0;background:none;color:var(--ink-3);font-size:20px;line-height:1;padding:2px 4px}
.pair .danger{color:var(--warn)}
.sync-bar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:8px 16px;background:var(--accent-soft);font-size:13px;border-bottom:1px solid var(--line)}
.sync-bar .btn{padding:4px 12px;font-size:13px}
.toc-back{display:none}
.r-top{grid-row:1}.sync-bar{grid-row:2}.r-body{grid-row:3}.player{grid-row:4}
#setBtn{display:none}
.here{position:fixed;z-index:8;padding:7px 14px;font-size:13px;border-radius:999px;box-shadow:var(--shadow)}
.player{position:relative}
.pl-prog{flex-basis:100%;order:-1;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pl-prog .chb{border:0;background:none;color:var(--ink-3);font:inherit;padding:4px 6px;border-radius:5px;cursor:pointer;white-space:nowrap}
.pl-prog .chb:hover:not(:disabled){color:var(--ink);background:var(--accent-soft)}
.pl-prog .chb:disabled{opacity:.35;cursor:default}
.pg-wrap{position:relative;flex:1;min-width:0;display:flex;align-items:center}
#progBar{-webkit-appearance:none;appearance:none;width:100%;height:18px;margin:0;background:transparent;cursor:pointer;--pct:0%}
#progBar::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--pct),var(--line) var(--pct))}
#progBar::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
#progBar::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
#progBar::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-4.5px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--accent)}
#progBar::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.pg-tip{position:absolute;bottom:calc(100% + 6px);transform:translateX(-50%);background:var(--ink);color:var(--surface);font-size:12px;padding:3px 8px;border-radius:5px;white-space:nowrap;pointer-events:none}
#progNum{min-width:6.5em;text-align:right;white-space:nowrap}

@media (max-width:820px){
  .shelf-head{padding-block:22px 18px}
  .brand h1{font-size:20px}
  .seal{width:34px;height:34px;font-size:19px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:26px 16px}
  .cover{padding:12px 9px 10px 16px}
  .cover::after{left:10px}
  .cv-title{font-size:14px;-webkit-line-clamp:4}
  .cv-rule{margin:8px 0 6px}
  .b-title{font-size:13px}
  .b-del{opacity:1;top:6px;right:6px;padding:2px 6px;font-size:11px}
  .cont{padding:16px;gap:14px;margin-bottom:30px}
  .cont .mini{display:none}
  .cont-info{min-width:0;flex:1}
  .cont-info h3{font-size:17px}
  .cont-actions{width:100%}
  .cont-actions .btn{flex:1;padding:11px}
  .note{margin-top:40px}
  .r-body{grid-template-columns:minmax(0,1fr)}
  #reader.toc-off .r-body{grid-template-columns:minmax(0,1fr)}
  .toc{position:absolute;inset:0 auto 0 0;width:min(300px,85vw);z-index:5;box-shadow:var(--shadow)}
  .toc li button{padding:11px 20px;font-size:14.5px}
  .toc-back{display:block;position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:4;border:0}
  #reader.toc-off .toc-back{display:none}
  .lbl{display:none}
  .r-top{gap:2px}
  .r-title b{display:none}
  .r-tools .ibtn{padding:6px 7px}
  .article{padding:26px 20px 40vh;line-height:1.9}
  .player{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"prog prog" "info set" "ctrl ctrl" "panel panel";gap:4px 12px;padding-top:10px;padding-bottom:12px}
  .pl-info{grid-area:info;min-width:0}
  .pl-prog{grid-area:prog;gap:4px;margin:0 -4px 2px}
  #progNum{min-width:0}
  .pl-prog .chb{padding:6px 10px;font-size:18px;line-height:1}
  .pl-prog .chw{display:none}
  #setBtn{display:inline-flex;grid-area:set;align-self:center;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}
  .pl-ctrl{grid-area:ctrl;justify-content:center;gap:34px;padding-top:2px}
  .pl-ctrl .ibtn{width:46px;height:46px}
  .play{width:58px;height:58px}
  #locateBtn{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(100% + 12px);box-shadow:var(--shadow);border-radius:999px}
  .pl-set{grid-area:panel;display:none;flex-direction:column;align-items:stretch;gap:12px;padding:10px 0 2px;border-top:1px solid var(--line);margin-top:6px}
  .player.set-open .pl-set{display:flex}
  .pl-set label{justify-content:space-between;font-size:13px}
  .pl-set select{max-width:none;flex:1;font-size:15px;padding:8px}
  .pl-set input[type=range]{flex:1;width:auto}
  #toast{bottom:200px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="shelf" class="view">
  <header class="shelf-head wrap">
    <div class="brand">
      <div class="seal" aria-hidden="true">读</div>
      <div><h1>阅读器 <span class="h1-cn">Reader</span></h1><p>你的书架 · 看与听同一份进度</p></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clean = s => String(s || '').replace(/[\s 　]+/g, ' ').trim();
const HAS_WORD = /[\p{L}\p{N}]/u;

/* ---------- prefs (per-browser convenience) ---------- */
const PREF_KEY = 'jingting-prefs';
const TOUCH = matchMedia('(pointer:coarse)').matches;
let prefs = { fs: matchMedia('(max-width:820px)').matches ? 18 : 19, serif: true, voice: '', rate: 1, toc: true };

/* ---------- storage: IndexedDB with in-memory fallback ---------- */
const DB = {
  db: null, ok: false, mem: { meta: new Map(), content: new Map() },
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('jingting-books', 1);
        r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('meta', { keyPath: 'id' }); d.createObjectStore('content', { keyPath: 'id' }); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);

    } catch (e) { this.ok = false; }
  },
  tx(store, mode, fn) {

      const t = this.db.transaction(store, mode); const r = fn(t.objectStore(store));
      t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);

  },
  async all(store) { if (this.ok) { try { return await this.tx(store, 'readonly', s => s.getAll()); } catch (e) {} } return [...this.mem[store].values()]; },
  async get(store, id) { if (this.ok) { try { return await this.tx(store, 'readonly', s => s.get(id)); } catch (e) {} } return this.mem[store].get(id); },
  async put(store, obj) { this.mem[store].set(obj.id, obj); if (this.ok) { try { await this.tx(store, 'readwrite', s => s.put(obj)); } catch (e) { console.warn(e); } } },
  async del(store, id) { this.mem[store].delete(id); if (this.ok) { try { await this.tx(store, 'readwrite', s => s.delete(id)); } catch (e) {} } }

/* ---------- text helpers ---------- */
const ENDERS = '。！？!?；;…';
const TRAIL = '。！？!?；;…」』”’）)】"\'';
function splitSentences(t) {
  const out = []; let buf = '';
  for (let i = 0; i < t.length; i++) {
    const ch = t[i]; buf += ch;
    if (ENDERS.includes(ch)) {
      while (i + 1 < t.length && TRAIL.includes(t[i + 1])) buf += t[++i];
      if (HAS_WORD.test(buf)) { out.push(buf); buf = ''; }
    } else if (buf.length > 160 && '，,、：:'.includes(ch)) { out.push(buf); buf = ''; }
  }
  if (buf) { if (out.length && !HAS_WORD.test(buf)) out[out.length - 1] += buf; else out.push(buf); }
  return out.length ? out : [t];
}
function chunkText(t, n) {
  if (t.length <= n) return [t];
  const out = []; let buf = '';
  for (const s of splitSentences(t)) {
    if (buf.length + s.length > n && buf) { out.push(buf); buf = ''; }
    if (s.length > n) { for (let i = 0; i < s.length; i += n) out.push(s.slice(i, i + n)); } else buf += s;
  }

}

/* ---------- TXT ---------- */
function decodeText(buf) {
  const u8 = new Uint8Array(buf);
  if (u8[0] === 0xFF && u8[1] === 0xFE) return new TextDecoder('utf-16le').decode(u8);
  if (u8[0] === 0xFE && u8[1] === 0xFF) return new TextDecoder('utf-16be').decode(u8);
  try { return new TextDecoder('utf-8', { fatal: true }).decode(u8); } catch (e) {}
  try { return new TextDecoder('gb18030').decode(u8); } catch (e) { return new TextDecoder('utf-8').decode(u8); }
}
const CH_RE = /^(第[0-9０-９零〇一二两三四五六七八九十百千万]+[章节回卷集部篇幕].{0,40}|(序章|序言|序|楔子|引子|前言|后记|尾声|终章|番外|附录)([\s:：·、].{0,40})?|chapter\s*\d+.{0,40})$/i;
function parseTxt(text) {
  const lines = text.split(/\r\n|\r|\n/).map(l => l.replace(/^[\s　﻿]+|[\s　]+$/g, '')).filter(Boolean);
  const chapters = []; let cur = null;
  for (const l of lines) {
    if (l.length <= 50 && CH_RE.test(l)) { cur = { title: l, paras: [l], heads: [0] }; chapters.push(cur); }
    else { if (!cur) { cur = { title: '卷首', paras: [], heads: [] }; chapters.push(cur); } cur.paras.push(l); }
  }
  const real = chapters.filter(c => c.heads.length);
  if (real.length < 2) {
    const all = chapters.flatMap(c => c.paras); const out = []; let c = null, len = 0;
    for (const l of all) { if (!c || len > 4000) { c = { title: `第 ${out.length + 1} 部分`, paras: [], heads: [] }; out.push(c); len = 0; } c.paras.push(l); len += l.length; }
    return out;
  }
  return chapters.filter(c => c.paras.length);
}

/* ---------- EPUB ---------- */
const parseXml = (s, type) => new DOMParser().parseFromString(s, type || 'application/xml');
const byTag = (doc, tag) => [...doc.getElementsByTagNameNS('*', tag)];
const dirOf = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';
function resolvePath(base, rel) {
  rel = (rel || '').split('#')[0];
  try { rel = decodeURIComponent(rel); } catch (e) {}
  if (rel.startsWith('/')) return rel.slice(1);
  const parts = base ? base.split('/') : [];
  for (const seg of rel.split('/')) { if (seg === '..') parts.pop(); else if (seg !== '.' && seg !== '') parts.push(seg); }
  return parts.join('/');
}
function zfile(zip, path) {
  if (!path) return null;
  return zip.file(path) || zip.file(encodeURI(path)) || Object.values(zip.files).find(f => f.name.toLowerCase() === path.toLowerCase()) || null;
}
function parseDoc(s) {
  let d = parseXml(s, 'application/xhtml+xml');
  if (d.getElementsByTagName('parsererror').length) d = parseXml(s, 'text/html');
  return d;
}
const BLOCK = new Set('p div h1 h2 h3 h4 h5 h6 li blockquote pre section article dd dt tr table ul ol dl figure figcaption header footer aside nav body td th hr'.split(' '));
const SKIP = new Set('script style head title svg math rt rp noscript'.split(' '));
function extract(root, out, heads, ids) {
  let buf = '';
  const flush = () => { const t = clean(buf); if (t && HAS_WORD.test(t)) out.push(t); buf = ''; };
  const walk = (node, inHead) => {
    for (const n of node.childNodes) {
      if (n.nodeType === 3) { buf += n.nodeValue; continue; }
      if (n.nodeType !== 1) continue;
      const tag = (n.localName || '').toLowerCase();
      if (SKIP.has(tag)) continue;
      const isBlock = BLOCK.has(tag);
      if (isBlock) flush();
      const id = n.getAttribute && n.getAttribute('id');
      if (id && !(id in ids)) ids[id] = out.length;
      if (tag === 'br') { flush(); continue; }
      if (isBlock) {
        const isH = /^h[1-6]$/.test(tag); const before = out.length;
        walk(n, inHead || isH); flush();
        if (isH || inHead) for (let k = before; k < out.length; k++) heads.add(k);
      } else walk(n, inHead);
    }
  };

}
async function parseEpub(file) {
  if (typeof JSZip === 'undefined') throw new Error('EPUB 解析组件没有加载成功，请检查网络后刷新');
  const zip = await JSZip.loadAsync(file);
  const cont = zfile(zip, 'META-INF/container.xml');
  if (!cont) throw new Error('这不是标准的 EPUB 文件');
  const opfPath = byTag(parseXml(await cont.async('string')), 'rootfile')[0]?.getAttribute('full-path');
  const opfF = zfile(zip, opfPath);
  if (!opfF) throw new Error('找不到书籍信息文件');
  if (zfile(zip, 'META-INF/encryption.xml') && !zfile(zip, 'META-INF/encryption.xml').name.endsWith('/')) {
    const enc = await zfile(zip, 'META-INF/encryption.xml').async('string');
    if (/EncryptedData/.test(enc) && !/font/i.test(enc)) throw new Error('这本 EPUB 有版权加密（DRM），无法读取');
  }
  const opf = parseXml(await opfF.async('string')); const base = dirOf(opfPath);
  const title = clean(byTag(opf, 'title')[0]?.textContent);
  const author = clean(byTag(opf, 'creator')[0]?.textContent);
  const man = {};
  byTag(opf, 'item').forEach(it => { man[it.getAttribute('id')] = { href: resolvePath(base, it.getAttribute('href')), type: it.getAttribute('media-type') || '', props: it.getAttribute('properties') || '' }; });
  const spineEl = byTag(opf, 'spine')[0];
  const spine = byTag(opf, 'itemref').map(r => man[r.getAttribute('idref')]).filter(x => x && /html|xml/i.test(x.type));

  let toc = [];
  const navItem = Object.values(man).find(m => /\bnav\b/.test(m.props));
  if (navItem) {
    const f = zfile(zip, navItem.href);
    if (f) {
      const d = parseDoc(await f.async('string'));
      const navs = [...d.getElementsByTagName('nav')];
      const nav = navs.find(n => /toc/.test((n.getAttribute('epub:type') || '') + (n.getAttributeNS && n.getAttributeNS('http://www.idpf.org/2007/ops', 'type') || ''))) || navs[0];
      if (nav) [...nav.getElementsByTagName('a')].forEach(a => {
        const h = a.getAttribute('href'); if (!h) return;
        toc.push({ title: clean(a.textContent), file: resolvePath(dirOf(navItem.href), h), hash: decodeURIComponent(h.split('#')[1] || '') });
      });
    }
  }
  if (!toc.length) {
    const ncxId = spineEl?.getAttribute('toc');
    const ncx = (ncxId && man[ncxId]) || Object.values(man).find(m => /ncx/.test(m.type));

      const f = zfile(zip, ncx.href);

        });

    }

  for (const it of spine) {
    if (it.href in fileStart) continue;

    if (!(t.file in fileStart)) continue;

    uniq.forEach((x, i) => mk(x.s, i + 1 < uniq.length ? uniq[i + 1].s : all.length, x.title));

    spine.forEach(it => { if (it.href in fileStart) mk(fileStart[it.href], fileEnd[it.href], ''); });
  }

}

const Sync = {
  on: false, ready: false, col: null, assets: null, chains: new Map(), timers: new Map(),
  async init() {
    if (SITE) return FB.init(this);
    if (!(window.claude && typeof window.claude.use === 'function')) return;
    setChip('connecting');
    const get = n => window.claude.use(n).catch(() => null);
    const [db, user, assets] = await Promise.all([get('db'), get('user'), get('assets')]);
    const uid = user ? await user.id() : null;
    if (!db || !uid || !assets) { setChip('local'); return; }
    this.assets = assets;
    try { this.col = db.doc(`data/users/${uid}/library`).collection('books'); } catch (e) { setChip('local'); return; }
    const timer = setTimeout(() => { if (!this.ready) setChip('slow'); }, 10000);
    this.col.onSnapshot(snap => {
      const changes = snap.docChanges();
      if (!snap.metadata.fromCache && !this.ready) {
        clearTimeout(timer); this.ready = this.on = true; setChip('on');
        setTimeout(() => this.pushMissing(), 0);
      }
      mergeRemote(changes);
    }, err => { clearTimeout(timer); this.on = false; setChip('local'); console.warn('sync', err); });
  },
  enqueue(id, fn) { /* one write at a time per book */
    const run = (this.chains.get(id) || Promise.resolve()).then(fn);
    this.chains.set(id, run.catch(() => {}));
    return run;
  },
  docOf(m) {
    return { title: m.title, author: m.author || '', format: m.format, addedAt: m.addedAt, lens: m.lens,
      chTitles: m.chTitles.map(t => String(t).slice(0, 40)), asset: m.asset,
      progress: m.progress, percent: m.percent || 0, lastRead: m.lastRead || 0, updatedAt: m.updatedAt || Date.now(),
      device: DEVICE_ID, deviceName: DEVICE_NAME };
  },
  async pushBook(m) {

    const content = await DB.get('content', m.id); if (!content) return;
    m.pushing = true;
    try {
      const blob = new Blob([JSON.stringify(content.chapters)], { type: 'application/json' });
      const up = await this.assets.upload(blob, { type: 'application/json' });
      m.asset = up.id; m.updatedAt = m.updatedAt || Date.now();
      await this.enqueue(m.id, () => this.col.doc(m.id).set(this.docOf(m)));
      m.synced = true; m.pushedAt = m.updatedAt; DB.put('meta', m); renderShelfIfVisible();
    } catch (e) {
      console.warn('sync upload', e);
      if (e && e.code === 'too_large') { m.localOnly = true; DB.put('meta', m); toast(`《${m.title}》超过 20MB，只保存在这台设备上`, 5000); }
      else if (e && e.code === 'quota_or_state') toast('云端空间已满，这本书只保存在这台设备上', 5000);
    } finally { m.pushing = false; }
  },
  async pushMissing() { for (const m of [...S.books]) if (!m.synced && !m.localOnly && !m.remoteOnly) await this.pushBook(m); },
  schedule(m) { /* throttle progress writes while reading/listening */

  flush(m) {

    if (!this.on || !m.synced || m.pushedAt === m.updatedAt) return;
    const at = m.updatedAt;
    this.enqueue(m.id, () => this.col.doc(m.id).update({ progress: { ...m.progress }, percent: m.percent || 0, lastRead: m.lastRead || 0, updatedAt: at, device: DEVICE_ID, deviceName: DEVICE_NAME }))
      .then(() => { m.pushedAt = at; }).catch(e => console.warn('sync progress', e));
  },
  remove(m) {
    if (!this.on || !m.synced) return;
    this.enqueue(m.id, () => this.col.doc(m.id).delete()).catch(() => {});
    if (m.asset) this.assets.delete(m.asset).catch(() => {});
  },
  stop() { /* stop syncing on this device; local books stay */
    if (this.unsub) { try { this.unsub(); } catch (e) {} this.unsub = null; }
    this.on = this.ready = false; this.col = null; this.assets = null;
    for (const m of S.books) if (m.synced) { m.synced = false; DB.put('meta', m); }
    setChip('local'); renderShelfIfVisible();
  }
};

const FB = {

  getCode() { try { return localStorage.getItem(SYNC_KEY); } catch (e) { return null; } },
  setCode(c) { try { c ? localStorage.setItem(SYNC_KEY, c) : localStorage.removeItem(SYNC_KEY); } catch (e) {} },
  newCode() { const a = new Uint8Array(15); crypto.getRandomValues(a); return [...a].map(b => 'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join(''); },
  link(c) { return location.origin + location.pathname + '#sync=' + c; },
  async lib() {
    if (window.firebase && firebase.firestore) return;
    await loadScript('https://www.gstatic.com/firebasejs/13.1.0/firebase-app-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore-compat.js');

  async init(sync) {

    sync.col = root.collection('books');
    sync.assets = { upload: b => this.upload(b), delete: id => this.remove(id) };
    const timer = setTimeout(() => { if (!sync.ready) setChip('slow'); }, 12000);
    sync.unsub = sync.col.onSnapshot(snap => {
      const changes = snap.docChanges();
      if (!snap.metadata.fromCache && !sync.ready) {
        clearTimeout(timer); sync.ready = sync.on = true; setChip('on');
        setTimeout(() => sync.pushMissing(), 0);

  },
  blobs() { return this.db.collection('sync').doc(this.code).collection('blobs'); },
  async upload(blob) { /* Firestore 单个文档上限 1 MB，书的内容按 25 万字分块存 */
    const text = await blob.text(); const id = 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

    for (let i = 0; i < n; i++) await col.doc(id + '_' + i).set({ d: text.slice(i * CH, (i + 1) * CH) });

    return JSON.parse(text);
  },
  async remove(id) {
    const col = this.blobs(); const meta = await col.doc(id).get(); const n = meta.exists ? meta.data().n : 0;
    for (let i = 0; i < n; i++) await col.doc(id + '_' + i).delete();

function mergeRemote(changes) {
  let dirty = false;
  for (const ch of changes) {
    const id = ch.doc.id; const i = S.books.findIndex(b => b.id === id); const m = S.books[i];
    if (ch.type === 'removed') {
      if (m && m.synced && !(S.book && S.book.id === id)) { S.books.splice(i, 1); DB.del('meta', id); DB.del('content', id); dirty = true; }
      continue;
    }
    const r = ch.doc.data(); if (!r) continue;
    if (!m) {
      const nm = { id, title: r.title || '未命名', author: r.author || '', format: r.format || 'txt', addedAt: r.addedAt || Date.now(),
        lastRead: r.lastRead || 0, progress: { c: 0, p: 0, s: 0, ...(r.progress || {}) }, percent: r.percent || 0,
        lens: [...(r.lens || [])], chTitles: [...(r.chTitles || [])], asset: r.asset, synced: true, remoteOnly: true,
        updatedAt: r.updatedAt || 0, pushedAt: r.updatedAt || 0 };
      S.books.push(nm); DB.put('meta', nm); dirty = true; continue;
    }
    m.synced = true; if (r.asset) m.asset = r.asset;
    if ((r.updatedAt || 0) > (m.updatedAt || 0) && r.progress) {
      if (S.book && S.book.id === id) {
        if (r.device !== DEVICE_ID && !samePos(r.progress, S.pos)) offerJump(m, r);
      } else {
        Object.assign(m, { progress: { c: 0, p: 0, s: 0, ...r.progress }, percent: r.percent || 0, lastRead: r.lastRead || m.lastRead, updatedAt: r.updatedAt, pushedAt: r.updatedAt });
        DB.put('meta', m); dirty = true;
      }
    }
  }
  if (dirty) renderShelfIfVisible();
}
let pendingJump = null;
function offerJump(m, r) {

  $('#syncBarText').textContent = `${r.deviceName || '另一台设备'}上读到了「${m.chTitles[pendingJump.c] || ''}」第 ${pendingJump.p + 1} 段`;

/* ---------- books ---------- */
function percentOf(meta, pos, content) {
  const total = meta.lens.reduce((a, b) => a + b, 0) || 1;
  let done = meta.lens.slice(0, pos.c).reduce((a, b) => a + b, 0);
  const ch = content && content.chapters[pos.c];
  if (ch) for (let i = 0; i < pos.p && i < ch.paras.length; i++) done += ch.paras[i].length;
  return Math.min(100, done / total * 100);
}
async function addBook(b, fmt, extra) {
  const id = 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const meta = { id, title: b.title, author: b.author || '', format: fmt, addedAt: Date.now(), lastRead: 0,
    progress: { c: 0, p: 0, s: 0 }, percent: 0,
    lens: b.chapters.map(c => c.paras.reduce((a, p) => a + p.length, 0)),
    chTitles: b.chapters.map(c => c.title), ...(extra || {}) };
  await DB.put('content', { id, chapters: b.chapters });
  await DB.put('meta', meta);
  S.books.push(meta);
  if (!meta.localOnly) Sync.pushBook(meta);
  return meta;
}
async function importFiles(files) {
  let added = 0;
  for (const f of files) {
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    if (!['txt', 'epub'].includes(ext)) { toast(`「${f.name}」不是 TXT 或 EPUB，已跳过`); continue; }
    toast(`正在导入「${f.name}」…`, 0);
    try {
      let b;
      if (ext === 'txt') b = { title: f.name.replace(/\.txt$/i, ''), author: '', chapters: parseTxt(decodeText(await f.arrayBuffer())) };
      else b = await parseEpub(f);
      if (!b.chapters.length) throw new Error('文件里没有文字');
      await addBook(b, ext); added++;
      toast(`已放上书架：《${b.title}》，共 ${b.chapters.length} 章`);
    } catch (e) { console.error(e); toast(`无法导入「${f.name}」：${e.message || e}`, 5000); }
  }
  if (added) renderShelf();
}

function chapCum(c) { /* 每段开头的累计字数，缓存到章节上 */

  if (!silent) { updatePlayUI(); wake(false); $('#locateBtn').hidden = true; if (S.book) { flushSave(); Sync.flush(S.book); } }
}
function primeSpeech() { /* iOS 需要在点击时先“解锁”语音 */
  primeAudio();
  try { if (window.speechSynthesis && !S.primed) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); S.primed = true; } } catch (e) {}
}
function finishBook() { stopPlayback(); clearHL(); toast('全书读完了'); }
function nextPosAfterChapter(c) {
  if (c + 1 < S.content.chapters.length) { S.pos = { c: c + 1, p: 0, s: 0 }; return true; }
  return false;
}
function speakBrowser(text) {
  return new Promise(res => {
    const u = new SpeechSynthesisUtterance(text);
    const key = $('#voiceSel').value.slice(2);
    const v = S.voices.find(x => x.voiceURI === key) || S.voices[0];
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'zh-CN';
    u.rate = prefs.rate;
    let done = false; const t0 = Date.now();
    const fin = ok => { if (done) return; done = true; clearTimeout(wd); res(ok); };
    u.onend = () => fin(Date.now() - t0 > 30 || text.length < 2);
    u.onerror = ev => fin(ev.error === 'interrupted' || ev.error === 'canceled');
    S.utt = u;
    const wd = setTimeout(() => fin(true), 8000 + text.length * 400 / prefs.rate);
    speechSynthesis.speak(u);
  });
}
async function runBrowser(g, until) {
  if (!window.speechSynthesis) { stopPlayback(); toast('这个浏览器不支持语音朗读，请换用 Edge 或 Chrome'); return; }
  await sleep(80);
  while (g === S.gen) {
    const pos = S.pos;
    if (until && pos.s === 0 && Date.now() >= until && isClaude()) { updatePlayUI(); return runClaude(g); }
    if (S.rc !== pos.c) showChapter(pos.c);
    if (pos.p >= S.sents.length) { if (nextPosAfterChapter(pos.c)) continue; finishBook(); return; }
    if (pos.s >= S.sents[pos.p].length) { S.pos = { c: pos.c, p: pos.p + 1, s: 0 }; continue; }
    const text = S.sents[pos.p][pos.s];
    highlight(pos.p, pos.s, false); saveProgress();
    if (HAS_WORD.test(text)) {
      const ok = await speakBrowser(text.trim());
      if (g !== S.gen) return;
      if (!ok) { if (++S.fails >= 3) { stopPlayback(); toast('浏览器语音无法播放。请换一个声音，或用 Edge / Chrome 打开本页'); return; } }
      else S.fails = 0;
    }
    if (g !== S.gen) return;
    S.pos = { c: pos.c, p: pos.p, s: pos.s + 1 };
  }
}
function onClaudeLine({ id }) {
  if (!id) return;
  const [gg, c, p] = id.split('|').map(Number);
  if (gg !== S.gen || c !== S.rc) return;
  S.pos = { c, p, s: 0 };
  highlight(p, 0, true); saveProgress();
}
function claudeErr(e) {
  const code = e && e.code;
  if (code === 'not_granted') { S.tts = null; renderVoiceSelect(); return 'Claude 语音已被关闭，已切回浏览器语音'; }
  if (code === 'rate_limited') return 'Claude 语音暂时用得太频繁，请稍等一会儿再播放';
  if (code === 'busy') return 'Claude 语音正忙，请稍后再试';
  return `Claude 语音出错了（${code || (e && e.message) || '未知原因'}），可以先换成浏览器语音`;
}
async function runClaude(g) {
  const t = S.tts; S.claudeActive = true;
  while (g === S.gen) {
    const pos = S.pos;
    if (S.rc !== pos.c) showChapter(pos.c);
    if (pos.p >= S.sents.length) { if (nextPosAfterChapter(pos.c)) continue; finishBook(); return; }
    const voice = $('#voiceSel').value.slice(2);
    const lines = []; let p = pos.p, chars = 0;
    for (; p < S.sents.length && lines.length < 20 && chars < 5000; p++) {
      const txt = (p === pos.p ? S.sents[p].slice(pos.s) : S.sents[p]).join('').trim();
      if (!HAS_WORD.test(txt)) continue;
      chunkText(txt, 1800).forEach(x => lines.push({ text: x, voice, rate: prefs.rate, id: `${g}|${pos.c}|${p}` }));
      chars += txt.length;
    }
    if (!lines.length) { S.pos = { c: pos.c, p, s: 0 }; continue; }
    highlight(pos.p, 0, true);
    try { await t.speak(lines); S.rlCount = 0; }
    catch (e) {
      if (g !== S.gen) return;
      S.claudeActive = false;
      if (e && (e.code === 'rate_limited' || e.code === 'busy') && window.speechSynthesis) {
        /* 被限流：不中断，先用浏览器声音接着读，稍后自动切回 Claude（等待时间逐次加长） */
        const wait = Math.min(10, 2 * 2 ** (S.rlCount || 0)); S.rlCount = (S.rlCount || 0) + 1;
        toast(`Claude 语音暂时用得太频繁，先用浏览器声音接着读，约 ${wait} 分钟后自动切回`, 6000);
        $('#plStateText').textContent = '正在朗读 · 临时浏览器声音';
        return runBrowser(g, Date.now() + wait * 60000);
      }
      stopPlayback(); toast(claudeErr(e), 5000); return;
    }
    if (g !== S.gen) return;
    S.pos = { c: pos.c, p, s: 0 };
  }
}
function updatePlayUI() {
  const pl = $('#player'); pl.classList.toggle('playing', S.playing);
  $('#icPlay').hidden = S.playing; $('#icPause').hidden = !S.playing;
  $('#playBtn').setAttribute('aria-label', S.playing ? '暂停' : '播放');
  $('#plStateText').textContent = S.playing ? '正在朗读' : (TOUCH ? '已暂停 · 点播放键开始' : '已暂停 · 按空格或播放键开始');
  updatePosText();
}
async function wake(on) {
  try {
    if (on && !S.wl && navigator.wakeLock) S.wl = await navigator.wakeLock.request('screen');
    else if (!on && S.wl) { await S.wl.release(); S.wl = null; }
  } catch (e) { S.wl = null; }
}
$('#playBtn').onclick = () => { if (S.playing) { stopPlayback(); markCursorNoScroll(); } else { primeSpeech(); startPlayback(); } };
$('#prevBtn').onclick = () => stepPara(-1);
$('#nextBtn').onclick = () => stepPara(1);
$('#backBtn').onclick = backToShelf;
$('#tocBtn').onclick = () => setToc($('#reader').classList.contains('toc-off'));
$('#fontUp').onclick = () => { prefs.fs = Math.min(28, prefs.fs + 1); savePrefs(); applyType(); };
$('#fontDown').onclick = () => { prefs.fs = Math.max(14, prefs.fs - 1); savePrefs(); applyType(); };
$('#fontFam').onclick = () => { prefs.serif = !prefs.serif; savePrefs(); applyType(); };
document.addEventListener('keydown', e => {
  if ($('#reader').hidden) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input', 'select', 'textarea'].includes(tag)) return;
  if (e.code === 'Space' && !e.repeat) { e.preventDefault(); $('#playBtn').click(); }
  else if (e.key === 'Escape' && window.innerWidth <= 820) setToc(false);
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.playing && !S.wl) wake(true);
  if (document.visibilityState === 'hidden') { flushSave(); Sync.flush(S.book); }
});
window.addEventListener('pagehide', () => { flushSave(); Sync.flush(S.book); });

/* ---------- Claude voice (optional) ---------- */
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('tts').then(t => {
    if (!t) return;
    S.tts = t;
    try { t.onLine(onClaudeLine); } catch (e) {}
    try { t.onState(({ state, reason }) => {
      if (state === 'idle' && reason === 'viewer_stopped' && S.claudeActive) { S.gen++; S.claudeActive = false; S.playing = false; updatePlayUI(); }
    }); } catch (e) {}
    renderVoiceSelect();
  }).catch(() => {});
}

/* ---------- boot ---------- */
(async () => {
  applyType();
  await DB.open();
  S.books = (await DB.all('meta')) || [];
  let seeded = false;
  try { seeded = localStorage.getItem('jingting-seeded') === '1'; } catch (e) {}
  if (!S.books.length && !seeded) {
    await addBook(GUIDE, 'txt', { sample: true, localOnly: true });
    try { localStorage.setItem('jingting-seeded', '1'); } catch (e) {}
  }
  renderShelf();
  Sync.init();
  if (!DB.ok) toast('这个浏览器不允许本地保存，刷新后书架会清空', 6000);
})();
})();
</script>
